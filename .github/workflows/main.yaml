name: Deploy
on:
  push:
    branches:
      - main
jobs: 
  deploy: 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /root/docker/express
            git pull
            docker rm -f cons-express
            docker build . -t img-express
            docker run -d -p 8080:8080 --name cons-express img-express
            docker image prune -f
  
